name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            typo3: '^13.4'
          - php: '8.4'
            typo3: '^13.4'
          - php: '8.5'
            typo3: '^13.4'
          - php: '8.3'
            typo3: '^14.2'
          - php: '8.4'
            typo3: '^14.2'
          - php: '8.5'
            typo3: '^14.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve matching Index branch
        id: index-ref
        env:
          INDEX_HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="${INDEX_HEAD_REF:-main}"
          if ! git ls-remote --exit-code --heads https://github.com/can0199/index.git "refs/heads/${ref}" >/dev/null; then
            ref=main
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2
          coverage: none

      - name: Require the right versions
        run: composer require typo3/cms-core:${{ matrix.typo3 }} typo3/cms-extbase:${{ matrix.typo3 }} --no-update

      - name: Require the matching Index branch
        env:
          INDEX_REF: ${{ steps.index-ref.outputs.ref }}
        run: |
          composer config repositories.index vcs https://github.com/can0199/index.git
          composer require --no-update "lochmueller/index:dev-${INDEX_REF}@dev"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer code-test
