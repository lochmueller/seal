<f:comment>
    A real list gives assistive technology the number of results and the current position
    within it. "start" keeps the numbering continuous across pagination (WCAG 1.3.1).
</f:comment>
<ol class="seal-results__list" start="{pagination.startRecordNumber}">
    <f:for each="{paginator.paginatedItems}" as="item" iteration="itemIteration">
        <li class="seal-results__item">
            <f:render partial="Result/Item" arguments="{item: item, itemIteration: itemIteration, sealId: sealId}"/>
        </li>
    </f:for>
</ol>
